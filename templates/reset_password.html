<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriSmart - Reset Password</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<div id="toast" class="toast"></div>

<div class="card">
    <div class="brand">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24"
             fill="none" stroke="#2E7D32" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
             class="brand-icon">
            <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/>
            <path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/>
        </svg>
        <span>AgriSmart</span>
    </div>

    <h2>Reset Password</h2>
    <p class="sub-heading">Enter your new password below</p>

    <form id="resetForm" novalidate autocomplete="off">
        <div class="form-group">
            <label for="newPassword">New Password</label>
            <div class="password-wrapper">
                <input type="password" id="newPassword" placeholder="Min 8 chars, 1 Upper, 1 Lower, 1 Digit, 1 Special" autocomplete="new-password">
                <button type="button" class="toggle-eye slashed" id="togglePassword1"></button>
            </div>
            <div class="error-msg" id="newPasswordError">Password must meet all requirements.</div>
        </div>

        <div class="form-group">
            <label for="confirmPassword">Confirm New Password</label>
            <div class="password-wrapper">
                <input type="password" id="confirmPassword" placeholder="Confirm your new password" autocomplete="new-password">
                <button type="button" class="toggle-eye slashed" id="togglePassword2"></button>
            </div>
            <div class="error-msg" id="confirmError">Passwords do not match.</div>
        </div>

        <button type="submit" class="btn-send" id="resetBtn">Reset Password</button>

        <div class="back-link">
            <a href="/login">← Back to Login</a>
        </div>

        <hr>

        <div class="footer">
            <div class="brand-sm">AgriSmart</div>
            <div>© 2024 AgriSmart. Cultivating precision through technology.</div>
            <div class="footer-links">
                <a href="#">Privacy Policy</a> |
                <a href="#">Terms of Service</a> |
                <a href="#">Support</a>
            </div>
        </div>
    </form>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');
    document.getElementById('togglePassword1')?.addEventListener('click', function() {
        const pwd = document.getElementById('newPassword');
        pwd.type = pwd.type === 'password' ? 'text' : 'password';
        this.classList.toggle('slashed', pwd.type === 'password');
    });
    document.getElementById('togglePassword2')?.addEventListener('click', function() {
        const pwd = document.getElementById('confirmPassword');
        pwd.type = pwd.type === 'password' ? 'text' : 'password';
        this.classList.toggle('slashed', pwd.type === 'password');
    });
    document.getElementById('resetForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const newPass = document.getElementById('newPassword').value;
        const confirmPass = document.getElementById('confirmPassword').value;
        const newPassError = document.getElementById('newPasswordError');
        const confirmError = document.getElementById('confirmError');
        const newPassInput = document.getElementById('newPassword');
        const confirmInput = document.getElementById('confirmPassword');
        newPassError.classList.remove('show');
        confirmError.classList.remove('show');
        newPassInput.classList.remove('error');
        confirmInput.classList.remove('error');
        const errors = [];
        if (newPass.length < 8) errors.push("at least 8 characters");
        if (!/[a-z]/.test(newPass)) errors.push("one lowercase letter (a-z)");
        if (!/[A-Z]/.test(newPass)) errors.push("one uppercase letter (A-Z)");
        if (!/\d/.test(newPass)) errors.push("one digit (0-9)");
        if (!/[!@#$%^&*(),.?":{}|<>]/.test(newPass)) errors.push("one special character (!@#$ etc)");
        if (errors.length > 0) {
            newPassError.textContent = "❌ Password must contain " + errors.join(", ") + ".";
            newPassInput.classList.add('error');
            newPassError.classList.add('show');
            return;
        }
        if (newPass !== confirmPass) {
            confirmInput.classList.add('error');
            confirmError.classList.add('show');
            return;
        }
        if (!token) {
            const toast = document.getElementById('toast');
            toast.textContent = '❌ Invalid or missing reset token';
            toast.className = 'toast show error';
            setTimeout(() => { toast.classList.remove('show'); }, 4000);
            return;
        }
        const btn = document.getElementById('resetBtn');
        btn.disabled = true;
        btn.textContent = 'Resetting...';
        try {
            const res = await fetch('/api/reset-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    token: token,
                    new_password: newPass
                })
            });
            const data = await res.json();
            const toast = document.getElementById('toast');
            if (res.ok) {
                toast.textContent = '✅ ' + (data.message || 'Password reset successful');
                toast.className = 'toast show success';
                setTimeout(() => { window.location.href = '/login'; }, 2000);
            } else {
                toast.textContent = '❌ ' + (data.error || 'Reset failed');
                toast.className = 'toast show error';
                setTimeout(() => { toast.classList.remove('show'); }, 4000);
            }
        } catch (err) {
            const toast = document.getElementById('toast');
            toast.textContent = '❌ Network error';
            toast.className = 'toast show error';
            setTimeout(() => { toast.classList.remove('show'); }, 4000);
        } finally {
            btn.disabled = false;
            btn.textContent = 'Reset Password';
        }
    });
</script>
</body>
</html>
